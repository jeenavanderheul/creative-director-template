<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Primary Meta Tags -->
    <title>Maximilian Storm — Creative Director</title>
    <meta name="title" content="Maximilian Storm — Creative Director" />
    <meta name="description" content="Creative Director with 15+ years building creative systems across advertising, film, and digital culture. Award-winning work for global and local brands." />
    <meta name="author" content="Maximilian Storm" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="Maximilian Storm — Creative Director" />
    <meta property="og:description" content="Creative Director with 15+ years building creative systems across advertising, film, and digital culture. Award-winning work for global and local brands." />
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://your-domain.com/" />
    <meta name="twitter:title" content="Maximilian Storm — Creative Director" />
    <meta name="twitter:description" content="Creative Director with 15+ years building creative systems across advertising, film, and digital culture." />
    <meta name="twitter:image" content="https://your-domain.com/og-image.jpg" />

    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />


    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <script>
      // Apply theme before React mounts to prevent flash of wrong theme
      (function() {
        try {
          var stored = localStorage.getItem('cd-template-theme');
          var isDark = stored === 'light' ? false : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0a0a0a';
          } else {
            document.documentElement.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
